<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Product - ZippyKart Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f3f6; color: #212121; }
        
        /* Navbar */
        .navbar { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: #e02844; text-decoration: none; }
        
        /* Container */
        .pro-container { max-width: 1200px; margin: 20px auto; display: flex; gap: 30px; background: transparent; }
        
        /* Left: Images */
        .pro-image-section { width: 40%; background: #fff; padding: 20px; border-radius: 8px; }
        .main-img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 4px; }
        
        /* Right: Details */
        .pro-details-section { width: 60%; background: #fff; padding: 30px; border-radius: 8px; }
        .pro-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .pro-price { font-size: 28px; font-weight: 700; color: #212121; margin: 10px 0; }
        
        /* Quantity & Buttons */
        .qty-selector { display: flex; align-items: center; border: 1px solid #ddd; width: fit-content; border-radius: 4px; margin: 15px 0; }
        .qty-btn { padding: 10px 20px; border: none; background: #f9f9f9; cursor: pointer; font-size: 18px; }
        #qtyInput { width: 50px; text-align: center; border: none; font-size: 16px; padding: 10px 0; }
        .action-btns { display: flex; gap: 15px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; color: white; }
        .add-cart { background: #ff9f00; }
        .buy-now { background: #fb641b; }

        /* Review Section */
        .review-section { margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px; }
        .rev-card { background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #e02844; }
        .rev-input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        .sub-btn { background: #e02844; color: #fff; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-top: 10px; }

        @media (max-width: 800px) {
            .pro-container { flex-direction: column; }
            .pro-image-section, .pro-details-section { width: 100%; }
        }
    </style>
</head>
<body>

<div class="navbar"><a href="index.html" class="logo">ZippyKart</a></div>

<div class="pro-container" id="productContent">
    <div class="pro-image-section">
        <img src="" id="MainImg" class="main-img">
    </div>
    <div class="pro-details-section">
        <h1 id="proTitle">Loading...</h1>
        <div class="pro-price" id="proPrice"></div>
        
        <div style="font-weight:600; margin-top:15px;">Quantity:</div>
        <div class="qty-selector">
            <button class="qty-btn" onclick="updateQty(-1)">-</button>
            <input type="text" id="qtyInput" value="1" readonly>
            <button class="qty-btn" onclick="updateQty(1)">+</button>
        </div>

        <div class="action-btns">
            <button class="btn add-cart" id="btnAddToCart">ADD TO CART</button>
            <a href="#" class="btn buy-now" id="btnBuyNow">BUY NOW</a>
        </div>

        <div class="review-section">
            <h2 class="section-title">Customer Reviews</h2>
            <div id="reviewContainer">Loading reviews...</div>
            
            <h2 class="section-title">Add Your Review</h2>
            <input type="text" id="revName" class="rev-input" placeholder="Your Name">
            <textarea id="revComment" class="rev-input" placeholder="Write your experience..."></textarea>
            <button class="sub-btn" onclick="submitReview()">Post Review</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk",
        authDomain: "zippykart-production-157e1.firebaseapp.com",
        projectId: "zippykart-production-157e1",
        storageBucket: "zippykart-production-157e1.appspot.com",
        messagingSenderId: "803651431969",
        appId: "1:803651431969:web:7432f351ec9f5f0ec23d60"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const productId = new URLSearchParams(window.location.search).get('id');

    // 1. Load Product Data
    db.collection("zippykart_products").doc(productId).get().then(doc => {
        if(doc.exists) {
            document.getElementById('proTitle').innerText = doc.data().title;
            document.getElementById('proPrice').innerText = "₹" + doc.data().price;
            document.getElementById('MainImg').src = doc.data().image;
        }
    });

    // 2. Fetch Reviews from Database
    db.collection("zippykart_reviews").where("productId", "==", productId).onSnapshot(snapshot => {
        const container = document.getElementById('reviewContainer');
        container.innerHTML = "";
        snapshot.forEach(doc => {
            const rev = doc.data();
            container.innerHTML += `<div class="rev-card"><strong>${rev.customerName}</strong><br>${rev.comment}</div>`;
        });
    });

    // 3. Submit Review Logic
    window.submitReview = function() {
        const name = document.getElementById('revName').value;
        const comment = document.getElementById('revComment').value;
        
        if(!name || !comment) return alert("Please enter Name and Review!");
        
        db.collection("zippykart_reviews").add({
            productId: productId,
            customerName: name,
            comment: comment,
            rating: 5,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => { 
            alert("Review Posted Successfully!"); 
            document.getElementById('revName').value = "";
            document.getElementById('revComment').value = "";
        });
    };

    window.updateQty = function(change) {
        let input = document.getElementById('qtyInput');
        let val = parseInt(input.value) + change;
        if(val >= 1) input.value = val;
    };
</script>
</body>
</html>
