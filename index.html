<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        
        /* Header Setup */
        header { background: #fff; padding: 10px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 15px; position: sticky; top: 0; z-index: 100; }
        .logo-box { font-weight: 900; font-size: 18px; color: #333; display: flex; align-items: center; }
        .search-bar { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .menu-wrapper { position: relative; cursor: pointer; font-size: 13px; font-weight: bold; color: #333; }
        .dropdown { display: none; position: absolute; background: #fff; border: 1px solid #ddd; width: 150px; z-index: 9999; top: 30px; left: -20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .dropdown div { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; font-weight: normal; }
        .cart-btn { background: #ff3e6c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* Nav Icons Setup */
        .nav-icons { display: flex; justify-content: center; gap: 20px; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; width: 60px; font-size: 11px; transition: 0.3s; }
        .nav-cat:hover { transform: scale(1.1); color: #ff3e6c; }
        .nav-cat i { display: block; font-size: 22px; margin-bottom: 5px; }
        
        /* Product Grid Setup */
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .product-card { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-align: center; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; cursor: pointer; border-radius: 4px; }
        .add-btn { background: #000; color: #fff; border: none; padding: 8px; width: 100%; margin-top: 5px; cursor: pointer; border-radius: 4px; }
        .buy-btn { background: #ff3e6c; color: #fff; border: none; padding: 8px; width: 100%; margin-top: 5px; cursor: pointer; border-radius: 4px; }
        
        /* Modal Setup */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: #fff; margin: 8% auto; padding: 20px; width: 320px; border-radius: 8px; text-align: center; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-cart-shopping" style="color:red; margin-right:5px;"></i> ZippyKart</div>
    <input type="text" class="search-bar" placeholder="Search for products, brands and more...">
    
    <div class="menu-wrapper" onclick="toggleDrop('loginDrop')">LOGIN ▾
        <div id="loginDrop" class="dropdown"><div onclick="window.location.href='profile.html'">My Profile</div><div>Orders</div></div>
    </div>
    
    <div class="menu-wrapper" onclick="toggleDrop('moreDrop')">MORE ▾
        <div id="moreDrop" class="dropdown"><div onclick="document.getElementById('chatBox').style.display='block'">AI Chat Support</div></div>
    </div>
    
    <button class="cart-btn"><i class="fa-solid fa-cart-shopping"></i> <span id="cartCount">0</span></button>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt" style="color:#ff5722;"></i>Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress" style="color:#e91e63;"></i>Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja" style="color:#673ab7;"></i>Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-child-reaching" style="color:#2196f3;"></i>Kids</div>
    <div class="nav-cat"><i class="fa-solid fa-robot" style="color:#4caf50;"></i>Toys</div>
    <div class="nav-cat"><i class="fa-solid fa-clock" style="color:#ff9800;"></i>Watch</div>
    <div class="nav-cat"><i class="fa-solid fa-wand-magic-sparkles" style="color:#9c27b0;"></i>Cosmetic</div>
    <div class="nav-cat"><i class="fa-solid fa-headphones" style="color:#00bcd4;"></i>Electronics</div>
</div>

<div class="product-grid" id="productGrid"></div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="document.getElementById('productModal').style.display='none'">&times;</span>
        <img id="modalImg" src="" style="width:100%; height:250px; object-fit:cover; border-radius:5px; margin-top: 15px;">
        <h3 id="modalName" style="margin: 10px 0 5px 0;"></h3>
        <p id="modalPrice" style="color:#ff3e6c; font-weight:bold; font-size: 18px; margin: 0;"></p>
        <p id="modalDesc" style="font-size: 13px; color: #555;">Premium quality product. 100% genuine material with easy 7 days return policy.</p>
        <button class="add-btn" onclick="addToCart()">Add to Cart</button>
        <button class="buy-btn" onclick="payNow()">Buy Now</button>
    </div>
</div>

<div id="chatBox" style="display:none; position:fixed; bottom:20px; right:20px; background:#fff; padding:15px; border:1px solid #ccc; width: 250px; border-radius: 8px; z-index:9999; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
    <strong style="color: #ff3e6c;">AI Agent Active</strong> 
    <button onclick="this.parentElement.style.display='none'" style="float:right; border:none; background:none; cursor:pointer; font-weight:bold;">X</button>
    <hr style="border-top: 1px solid #eee;">
    <p style="font-size: 12px;">Hello Akash! How can I help you with ZippyKart today?</p>
</div>

<script>
    let cart = 0;
    const products = [
        { n: "Streetwear Tee", p: 899, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" },
        { n: "Cargo Pants", p: 1299, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=300" },
        { n: "Floral Gown", p: 1499, img: "https://images.unsplash.com/photo-1515372039744-b8f02a3ae2a6?w=300" },
        { n: "Headphones", p: 3499, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" }
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(item => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${item.img}" onclick="openModal('${item.n}', '${item.img}', '${item.p}')">
                <div style="font-weight:bold; font-size:13px; margin:8px 0 4px 0;">${item.n}</div>
                <div style="color:red; font-weight:bold; margin-bottom: 8px;">₹${item.p}</div>
                <button class="add-btn" onclick="addToCart()">Add to Cart</button>
                <button class="buy-btn" onclick="payNow('${item.p}')">Buy Now</button>
            </div>`;
    });

    function openModal(n, i, p) {
        document.getElementById('modalName').innerText = n;
        document.getElementById('modalImg').src = i;
        document.getElementById('modalPrice').innerText = "₹" + p;
        document.getElementById('productModal').style.display = 'block';
    }
    
    function addToCart() {
        cart++;
        document.getElementById('cartCount').innerText = cart;
        alert("Product added to cart successfully!");
    }

    function toggleDrop(id) {
        document.querySelectorAll('.dropdown').forEach(d => { if(d.id !== id) d.style.display = 'none'; });
        const drop = document.getElementById(id);
        drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
    }

    window.payNow = (p) => { alert("Razorpay API Key setup needed to proceed with ₹" + p); };

    window.onclick = (e) => { 
        if(!e.target.closest('.menu-wrapper')) {
            document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
        }
        if(e.target == document.getElementById('productModal')) {
            document.getElementById('productModal').style.display = 'none';
        }
    };
</script>
</body>
</html>
