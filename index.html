<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        /* Header & Search */
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 20px; }
        .logo-box { display: flex; align-items: center; font-weight: 900; font-size: 20px; cursor: pointer; }
        .search-bar { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn-cart { background: #ff3e6c; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        /* Category Icons */
        .nav-icons { display: flex; justify-content: center; gap: 25px; padding: 20px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; font-size: 14px; }
        .nav-cat i { display: block; font-size: 22px; color: #333; margin-bottom: 5px; }
        /* Auth & Chat */
        #authOverlay, #chatBox { display: none; position: fixed; z-index: 9999; }
        #authOverlay { top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 25px; border-radius: 10px; width: 280px; text-align: center; }
        #chatBox { bottom: 20px; right: 20px; width: 250px; height: 300px; background: #fff; border: 1px solid #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.2); padding: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-cart-shopping" style="color:red; margin-right:8px;"></i> ZippyKart</div>
    <input type="text" class="search-bar" id="searchInp" placeholder="Search modern shirts, premium toys...">
    <div style="cursor:pointer;" onclick="showAuth()">LOGIN</div>
    <div style="cursor:pointer;" onclick="toggleDrop()">MORE ▾</div>
    <button class="btn-cart"><i class="fa-solid fa-cart-shopping"></i> CART (0)</button>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt"></i> Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress"></i> Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja"></i> Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-child-reaching"></i> Kids</div>
    <div class="nav-cat"><i class="fa-solid fa-robot"></i> Toys</div>
    <div class="nav-cat"><i class="fa-solid fa-clock"></i> Watch</div>
    <div class="nav-cat"><i class="fa-solid fa-wand-magic-sparkles"></i> Cosmetic</div>
    <div class="nav-cat" onclick="openChat()"><i class="fa-solid fa-headphones"></i> Electronics</div>
</div>

<div id="chatBox">
    <div style="background:#000; color:#fff; padding:5px;">AI Support <button onclick="this.parentElement.parentElement.style.display='none'" style="float:right;">X</button></div>
    <div id="chatArea" style="height:200px; overflow-y:scroll; font-size:12px;">Hello! How can I help you?</div>
    <input type="text" id="msg" style="width:70%;"><button onclick="sendMsg()">Send</button>
</div>

<div id="authOverlay">
    <div class="auth-box">
        <h3>Login</h3>
        <input type="email" id="emailInput" placeholder="Email" style="width:90%; padding:10px;">
        <input type="password" id="passInput" placeholder="Password" style="width:90%; padding:10px; margin:10px 0;">
        <button id="emailLoginBtn" style="width:100%; padding:10px; background:#000; color:#fff; border:none;">Login</button>
        <button onclick="document.getElementById('authOverlay').style.display='none'" style="width:100%; padding:10px; margin-top:10px;">Close</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const auth = getAuth(initializeApp({
        apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk",
        authDomain: "zippykart-production-157e1.firebaseapp.com",
        projectId: "zippykart-production-157e1"
    }));

    window.showAuth = () => document.getElementById('authOverlay').style.display = 'flex';
    window.openChat = () => document.getElementById('chatBox').style.display = 'block';
    window.sendMsg = () => { document.getElementById('chatArea').innerHTML += "<br>You: " + document.getElementById('msg').value; document.getElementById('msg').value = ''; };
    document.getElementById('searchInp').onkeypress = (e) => { if(e.key === 'Enter') alert("Searching: " + e.target.value); };
</script>
</body>
</html>
