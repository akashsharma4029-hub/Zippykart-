<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #fff; padding: 10px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 15px; }
        .logo-box { font-weight: 900; font-size: 18px; color: #333; display: flex; align-items: center; }
        .search-bar { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .nav-icons { display: flex; justify-content: center; gap: 20px; padding: 10px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; width: 60px; font-size: 10px; transition: 0.3s; }
        .nav-cat:hover { transform: scale(1.1); color: #ff3e6c; }
        .nav-cat i { display: block; font-size: 20px; margin-bottom: 4px; }
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
        .product-card { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-align: center; }
        .buy-btn { background: #ff3e6c; color: #fff; border: none; padding: 8px; width: 100%; margin-top: 5px; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: #fff; margin: 10% auto; padding: 20px; width: 300px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-cart-shopping" style="color:red; margin-right:5px;"></i> ZippyKart</div>
    <input type="text" class="search-bar" placeholder="Search...">
    <button style="background:#ff3e6c; color:white; border:none; padding:8px;"><i class="fa-solid fa-cart-shopping"></i> <span id="cartCount">0</span></button>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt" style="color:#ff5722;"></i>Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress" style="color:#e91e63;"></i>Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja" style="color:#673ab7;"></i>Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-robot" style="color:#4caf50;"></i>Toys</div>
</div>

<div class="product-grid" id="productGrid"></div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span onclick="document.getElementById('productModal').style.display='none'" style="float:right; cursor:pointer;">&times;</span>
        <img id="modalImg" src="" style="width:100%; border-radius:5px;">
        <h3 id="modalName"></h3>
        <p id="modalPrice" style="color:red; font-weight:bold;"></p>
        <p id="modalDesc">Detailed description of the product goes here. Premium quality, best in class.</p>
        <button class="buy-btn" onclick="payNow()">Buy Now</button>
    </div>
</div>

<script>
    const products = [
        { n: "Streetwear Tee", p: 899, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" },
        { n: "Cargo Pants", p: 1299, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=300" }
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(item => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${item.img}" onclick="openModal('${item.n}', '${item.img}', '${item.p}')" style="cursor:pointer;">
                <div style="font-weight:bold; font-size:12px; margin:5px 0;">${item.n}</div>
                <button class="buy-btn" onclick="payNow('${item.p}')">Buy Now</button>
            </div>`;
    });

    function openModal(n, i, p) {
        document.getElementById('modalName').innerText = n;
        document.getElementById('modalImg').src = i;
        document.getElementById('modalPrice').innerText = "Price: ₹" + p;
        document.getElementById('productModal').style.display = 'block';
    }
    
    window.payNow = () => { alert("Redirecting to Razorpay..."); };
    window.onclick = (e) => { if(e.target == document.getElementById('productModal')) document.getElementById('productModal').style.display = 'none'; };
</script>
</body>
</html>
