<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 15px; }
        .logo-box { font-weight: 900; font-size: 20px; color: #333; display: flex; align-items: center; }
        .search-bar { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        
        .nav-icons { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; width: 60px; font-size: 11px; transition: 0.3s; }
        .nav-cat:hover { transform: scale(1.2); color: #ff3e6c; }
        .nav-cat i { display: block; font-size: 22px; margin-bottom: 5px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
        .product-card { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-align: center; cursor: pointer; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; }
        .p-name { font-size: 12px; font-weight: bold; margin: 5px 0; }
        .p-price { font-size: 13px; font-weight: bold; color: #ff3e6c; }
        .p-rating { color: #f39c12; font-size: 10px; }
        .add-btn { background: #000; color: #fff; border: none; padding: 8px; width: 100%; margin-top: 5px; cursor: pointer; }

        .menu-wrapper { position: relative; cursor: pointer; font-weight: bold; font-size: 14px; }
        .dropdown { display: none; position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid #ddd; width: 200px; z-index: 9999; }
        .dropdown div { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }
        .dropdown div:hover { background: #f5f5f5; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-cart-shopping" style="color:red; margin-right:8px;"></i> ZippyKart</div>
    <input type="text" class="search-bar" placeholder="Search...">
    <div class="menu-wrapper" onclick="toggle('loginDrop')">LOGIN ▾
        <div id="loginDrop" class="dropdown">
            <div onclick="showAuth()"><i class="fa-regular fa-user"></i> My Profile</div>
            <div><i class="fa-solid fa-box"></i> Orders</div>
            <div><i class="fa-regular fa-heart"></i> Wishlist</div>
        </div>
    </div>
    <div class="menu-wrapper" onclick="toggle('moreDrop')">MORE ▾
        <div id="moreDrop" class="dropdown">
            <div><i class="fa-solid fa-bell"></i> Notifications</div>
            <div><i class="fa-solid fa-headset"></i> Customer Care</div>
            <div><i class="fa-solid fa-chart-line"></i> Advertise</div>
        </div>
    </div>
    <button style="background:#ff3e6c; color:white; border:none; padding:10px;">CART (0)</button>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt"></i>Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress"></i>Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja"></i>Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-child-reaching"></i>Kids</div>
    <div class="nav-cat"><i class="fa-solid fa-robot"></i>Toys</div>
    <div class="nav-cat"><i class="fa-solid fa-clock"></i>Watch</div>
    <div class="nav-cat"><i class="fa-solid fa-wand-magic-sparkles"></i>Cosmetic</div>
    <div class="nav-cat"><i class="fa-solid fa-headphones"></i>Electronics</div>
</div>

<div class="product-grid" id="productGrid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    const firebaseConfig = { apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk", authDomain: "zippykart-production-157e1.firebaseapp.com", projectId: "zippykart-production-157e1" };
    initializeApp(firebaseConfig);

    const categories = ["Men", "Women", "Sweatshirt", "Kids", "Toys", "Watch", "Cosmetic", "Electronics"];
    const images = [
        "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300",
        "https://images.unsplash.com/photo-1515372039744-b8f02a3ae2a6?w=300",
        "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=300",
        "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=300"
    ];

    const grid = document.getElementById('productGrid');
    categories.forEach(cat => {
        for(let i=0; i<4; i++) {
            let img = images[i % images.length];
            grid.innerHTML += `
                <div class="product-card" onclick="alert('Full details for ${cat} Product ${i+1}')">
                    <img src="${img}">
                    <div class="p-name">${cat} Style ${i+1}</div>
                    <div class="p-rating">★★★★☆</div>
                    <div class="p-price">₹${Math.floor(Math.random()*2000)+500}</div>
                    <button class="add-btn">ADD TO CART</button>
                </div>
            `;
        }
    });

    window.toggle = (id) => {
        document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    };
    window.onclick = (e) => { if(!e.target.matches('.menu-wrapper')) document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none'); };
</script>
</body>
</html>
