<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; }
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; }
        .logo { font-weight: 900; font-size: 24px; margin-right: auto; }
        .nav-group { display: flex; align-items: center; gap: 20px; }
        .nav-item { cursor: pointer; position: relative; }
        .dropdown { display: none; position: absolute; top: 120%; right: 0; background: #fff; border: 1px solid #ddd; width: 180px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 4px; padding: 10px 0; z-index: 1000; }
        .dropdown div { padding: 10px 15px; cursor: pointer; }
        .dropdown div:hover { background: #f5f5f5; }
        
        /* Auth Popup */
        #authOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 25px; border-radius: 10px; width: 280px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>

<header>
    <div class="logo">Zippy<span style="color:red;">Kart</span></div>
    <div class="nav-group">
        <div class="nav-item" onclick="toggleDrop('loginDrop')">
            <i class="fa-regular fa-user"></i> Login <i class="fa-solid fa-chevron-down"></i>
            <div id="loginDrop" class="dropdown">
                <div onclick="showAuth()"><i class="fa-regular fa-user"></i> My Profile</div>
                <div><i class="fa-solid fa-box"></i> Orders</div>
                <div><i class="fa-regular fa-heart"></i> Wishlist</div>
            </div>
        </div>
        <div class="nav-item" onclick="toggleDrop('moreDrop')">
            More <i class="fa-solid fa-chevron-down"></i>
            <div id="moreDrop" class="dropdown">
                <div><i class="fa-solid fa-bell"></i> Notification Settings</div>
                <div><i class="fa-solid fa-headset"></i> 24x7 Customer Care</div>
                <div><i class="fa-solid fa-chart-line"></i> Advertise</div>
            </div>
        </div>
    </div>
</header>

<div id="authOverlay">
    <div class="auth-box">
        <h3>Login / Sign Up</h3>
        <input type="email" id="emailInput" placeholder="Email">
        <input type="password" id="passInput" placeholder="Password">
        <button id="emailLoginBtn" style="width:100%; padding:10px; background:#000; color:#fff; border:none; cursor:pointer;">Login / Sign Up</button>
        <button id="googleBtn" style="width:100%; padding:10px; background:#4285F4; color:#fff; border:none; margin-top:10px; cursor:pointer;">Sign in with Google</button>
        <button onclick="document.getElementById('authOverlay').style.display='none'" style="width:100%; padding:10px; background:#ccc; border:none; margin-top:10px; cursor:pointer;">Close</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const auth = getAuth(initializeApp({ /* firebaseConfig yahan wapas daal do */ }));

    window.toggleDrop = (id) => {
        document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    };

    window.showAuth = () => {
        document.getElementById('authOverlay').style.display = 'flex';
        document.getElementById('loginDrop').style.display = 'none';
    };

    document.getElementById('googleBtn').onclick = () => {
        signInWithPopup(auth, new GoogleAuthProvider()).then(() => alert("Login Success!")).catch(e => alert(e.message));
    };

    document.getElementById('emailLoginBtn').onclick = () => {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passInput').value;
        signInWithEmailAndPassword(auth, email, pass).catch(() => createUserWithEmailAndPassword(auth, email, pass)).then(() => alert("Success!")).catch(e => alert(e.message));
    };
</script>
</body>
</html>
