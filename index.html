<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        /* Header Section */
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 20px; }
        .logo-box { font-weight: 900; font-size: 22px; color: #333; display: flex; align-items: center; }
        .search-bar { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        
        /* Nav Icons Section */
        .nav-icons { display: flex; justify-content: center; gap: 15px; padding: 20px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; transition: 0.3s; width: 60px; font-size: 11px; }
        .nav-cat:hover { transform: scale(1.2); color: #ff3e6c; }
        .nav-cat i { display: block; font-size: 22px; margin-bottom: 5px; }
        
        /* Product Grid Section */
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
        .product-card { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-align: center; display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .p-name { font-size: 12px; font-weight: bold; margin: 8px 0 4px; height: 30px; overflow: hidden; }
        .p-price { font-size: 14px; font-weight: bold; color: #ff3e6c; margin-bottom: 4px; }
        .p-rating { color: #f39c12; font-size: 10px; margin-bottom: 8px; }
        .add-btn { background: #000; color: #fff; border: none; padding: 8px; font-size: 11px; cursor: pointer; border-radius: 3px; margin-top: auto; }
        .buy-btn { background: #ff3e6c; color: #fff; border: none; padding: 8px; font-size: 11px; cursor: pointer; border-radius: 3px; margin-top: 5px; }

        /* Dropdowns & Modals */
        .menu-wrapper { position: relative; cursor: pointer; font-weight: bold; font-size: 14px; }
        .dropdown { display: none; position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid #ddd; width: 200px; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .dropdown div { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; cursor: pointer; }
        .dropdown div:hover { background: #f5f5f5; color: #ff3e6c; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-cart-shopping" style="color:red; margin-right:8px;"></i> ZippyKart</div>
    <input type="text" class="search-bar" placeholder="Search modern shirts, premium toys...">
    <div class="menu-wrapper" onclick="toggle('loginDrop')">LOGIN ▾
        <div id="loginDrop" class="dropdown">
            <div onclick="alert('Profile Details')"><i class="fa-regular fa-user"></i> My Profile</div>
            <div><i class="fa-solid fa-box"></i> Orders</div>
            <div><i class="fa-regular fa-heart"></i> Wishlist</div>
        </div>
    </div>
    <div class="menu-wrapper" onclick="toggle('moreDrop')">MORE ▾
        <div id="moreDrop" class="dropdown">
            <div><i class="fa-solid fa-bell"></i> Notifications</div>
            <div><i class="fa-solid fa-headset"></i> Customer Care</div>
            <div><i class="fa-solid fa-chart-line"></i> Advertise</div>
        </div>
    </div>
    <button style="background:#ff3e6c; color:white; border:none; padding:10px;">CART (0)</button>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt"></i>Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress"></i>Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja"></i>Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-child-reaching"></i>Kids</div>
    <div class="nav-cat"><i class="fa-solid fa-robot"></i>Toys</div>
    <div class="nav-cat"><i class="fa-solid fa-clock"></i>Watch</div>
    <div class="nav-cat"><i class="fa-solid fa-wand-magic-sparkles"></i>Cosmetic</div>
    <div class="nav-cat"><i class="fa-solid fa-headphones"></i>Electronics</div>
</div>

<div class="product-grid" id="productGrid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    const firebaseConfig = { apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk", authDomain: "zippykart-production-157e1.firebaseapp.com", projectId: "zippykart-production-157e1" };
    initializeApp(firebaseConfig);

    const categories = ["Men", "Women", "Sweatshirt", "Kids", "Toys", "Watch", "Cosmetic", "Electronics"];
    const grid = document.getElementById('productGrid');
    
    categories.forEach(cat => {
        for(let i=1; i<=4; i++) {
            grid.innerHTML += `
                <div class="product-card">
                    <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" onclick="alert('Full Product Details for ${cat} ${i}: \n- Quality: Premium \n- Material: 100% Cotton \n- Delivery: 3-5 Days')">
                    <div class="p-name">${cat} Style ${i}</div>
                    <div class="p-rating">★★★★☆</div>
                    <div class="p-price">₹${Math.floor(Math.random()*2000)+500}</div>
                    <button class="add-btn">ADD TO CART</button>
                    <button class="buy-btn" onclick="payNow()">BUY NOW</button>
                </div>
            `;
        }
    });

    window.payNow = () => {
        var options = { "key": "rzp_test_YourRazorpayKey", "amount": "10000", "currency": "INR", "name": "ZippyKart", "description": "Payment", "handler": function (response){ alert("Payment Success!"); } };
        new Razorpay(options).open();
    };

    window.toggle = (id) => {
        document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    };
    window.onclick = (e) => { if(!e.target.matches('.menu-wrapper')) document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none'); };
</script>
</body>
</html>
