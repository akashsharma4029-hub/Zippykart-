<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippykart.co.in | Official Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f1f2f4; margin: 0; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .card { background: #fff; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #ddd; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .buy-btn { width: 100%; padding: 10px; background: #111; color: #fff; border: none; margin-top: 10px; text-transform: uppercase; font-weight: bold; cursor: pointer; }
        #authOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 25px; border-radius: 10px; width: 280px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; font-size:20px;">Zippy<span style="color:red;">Kart</span></div>
    <div onclick="document.getElementById('authOverlay').style.display='flex'" style="cursor:pointer;"><i class="fa-solid fa-user"></i> Login</div>
</header>

<div id="authOverlay">
    <div class="auth-box">
        <h3>Login / Sign Up</h3>
        <input type="tel" id="phoneInput" placeholder="Enter 10 digit number" style="width:90%; padding:10px; margin:10px 0;">
        <button id="otpBtn" style="width:100%; padding:10px; background:#000; color:#fff; border:none; cursor:pointer;">Send OTP</button>
        <button id="googleBtn" style="width:100%; padding:10px; background:#4285F4; color:#fff; border:none; margin-top:10px; cursor:pointer;">Sign in with Google</button>
        <button onclick="document.getElementById('authOverlay').style.display='none'" style="width:100%; padding:10px; background:#ccc; border:none; margin-top:10px; cursor:pointer;">Close</button>
    </div>
</div>

<h2 style="text-align:center; padding:20px;">Trending Culture Drops</h2>
<div class="grid" id="productGrid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk",
        authDomain: "zippykart-production-157e1.firebaseapp.com",
        projectId: "zippykart-production-157e1",
        storageBucket: "zippykart-production-157e1.firebasestorage.app",
        messagingSenderId: "803651431969",
        appId: "1:803651431969:web:7432f351ec9f5f0ec23d60"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const products = [
        { title: "Men's Oversized Streetwear Overshirt", price: 899, img: "https://images.unsplash.com/photo-1602810318386-749160533385?w=500" },
        { title: "Men's Baggy Multi-Pocket Cargo", price: 1299, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500" }
    ];
    document.getElementById('productGrid').innerHTML = products.map(p => `
        <div class="card">
            <img src="${p.img}">
            <p><b>${p.title}</b></p>
            <p>₹${p.price}</p>
            <button class="buy-btn">ADD TO CART</button>
        </div>`).join('');

    document.getElementById('googleBtn').onclick = () => {
        signInWithPopup(auth, new GoogleAuthProvider()).then(() => alert("Login Success!")).catch(e => alert(e.message));
    };

    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'otpBtn', { 'size': 'invisible' });

    document.getElementById('otpBtn').onclick = () => {
        let number = document.getElementById('phoneInput').value.trim();
        if (!number.startsWith('+')) {
            number = '+91' + number;
        }
        signInWithPhoneNumber(auth, number, window.recaptchaVerifier)
            .then(res => { window.confirmationResult = res; alert("OTP Sent to " + number); })
            .catch(e => alert("Error: " + e.message));
    };
</script>
</body>
</html>
