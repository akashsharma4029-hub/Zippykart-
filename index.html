<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; }
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; position: relative; }
        .logo { font-weight: 900; font-size: 24px; margin-right: 30px; }
        .nav-item { margin-left: 20px; cursor: pointer; position: relative; }
        .dropdown { display: none; position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid #ddd; width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 4px; padding: 10px 0; z-index: 1000; }
        .dropdown div { padding: 10px 15px; cursor: pointer; }
        .dropdown div:hover { background: #f5f5f5; color: #2874f0; }
    </style>
</head>
<body>

<header>
    <div class="logo">Zippy<span style="color:red;">Kart</span></div>
    
    <div class="nav-item" onclick="toggleDrop('loginDrop')">
        <i class="fa-regular fa-user"></i> Login <i class="fa-solid fa-chevron-down"></i>
        <div id="loginDrop" class="dropdown">
            <div><i class="fa-regular fa-user"></i> My Profile</div>
            <div><i class="fa-solid fa-box"></i> Orders</div>
            <div><i class="fa-regular fa-heart"></i> Wishlist</div>
        </div>
    </div>

    <div class="nav-item" onclick="toggleDrop('moreDrop')">
        More <i class="fa-solid fa-chevron-down"></i>
        <div id="moreDrop" class="dropdown">
            <div><i class="fa-solid fa-bell"></i> Notification Settings</div>
            <div><i class="fa-solid fa-headset"></i> 24x7 Customer Care</div>
            <div><i class="fa-solid fa-chart-line"></i> Advertise on Zippykart</div>
        </div>
    </div>
</header>

<script>
    function toggleDrop(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
    // Close dropdowns when clicking outside
    window.onclick = (e) => {
        if (!e.target.matches('.nav-item')) {
            document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
        }
    }
</script>
</body>
</html>
