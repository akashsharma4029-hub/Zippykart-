<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 15px; }
        .logo-box { font-weight: 900; font-size: 20px; color: #333; }
        .nav-icons { display: flex; justify-content: center; gap: 20px; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; width: 70px; font-size: 11px; transition: 0.3s; }
        .nav-cat:hover { transform: scale(1.2); }
        .nav-cat i { font-size: 28px; margin-bottom: 8px; display: block; }
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .product-card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; text-align: center; }
        .buy-btn { background: #ff3e6c; color: #fff; border: none; padding: 10px; width: 100%; margin-top: 5px; cursor: pointer; }
        .dropdown { display: none; position: absolute; background: #fff; border: 1px solid #ddd; width: 180px; z-index: 9999; }
        .dropdown div { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        #chatBox { display: none; position: fixed; bottom: 20px; right: 20px; width: 250px; background: #fff; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo-box">ZippyKart</div>
    <input type="text" style="flex:1; padding:10px;" placeholder="Search...">
    <div onclick="toggle('loginDrop')">LOGIN ▾ 
        <div id="loginDrop" class="dropdown"><div onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i> Profile</div></div>
    </div>
    <div onclick="toggle('moreDrop')">MORE ▾ 
        <div id="moreDrop" class="dropdown"><div onclick="document.getElementById('chatBox').style.display='block'"><i class="fa-solid fa-headset"></i> AI Agent</div></div>
    </div>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt" style="color:#ff5722;"></i>Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress" style="color:#e91e63;"></i>Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja" style="color:#673ab7;"></i>Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-child-reaching" style="color:#2196f3;"></i>Kids</div>
    <div class="nav-cat"><i class="fa-solid fa-robot" style="color:#4caf50;"></i>Toys</div>
    <div class="nav-cat"><i class="fa-solid fa-clock" style="color:#ff9800;"></i>Watch</div>
    <div class="nav-cat"><i class="fa-solid fa-wand-magic-sparkles" style="color:#9c27b0;"></i>Cosmetic</div>
    <div class="nav-cat"><i class="fa-solid fa-headphones" style="color:#00bcd4;"></i>Electronics</div>
</div>

<div class="product-grid" id="productGrid"></div>

<div id="chatBox">AI Customer Agent <button onclick="this.parentElement.style.display='none'">X</button><hr>Hello! How can I help?</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    const firebaseConfig = { apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk", projectId: "zippykart-production-157e1" };
    initializeApp(firebaseConfig);

    const products = [
        { n: "Streetwear Tee", p: 899, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" },
        { n: "Cargo Pants", p: 1299, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=300" }
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(item => {
        grid.innerHTML += `<div class="product-card"><img src="${item.img}" style="width:100%"><p>${item.n}</p><button class="buy-btn" onclick="pay('${item.p}')">Buy Now</button></div>`;
    });

    window.pay = (p) => { new Razorpay({ "key": "rzp_live_SuidRs4KmU9W6w", "amount": p*100, "currency": "INR", "name": "ZippyKart", "handler": function(r){ alert("Success!"); } }).open(); };
    window.toggle = (id) => { document.getElementById(id).style.display = (document.getElementById(id).style.display === 'block') ? 'none' : 'block'; };
</script>
</body>
</html>
