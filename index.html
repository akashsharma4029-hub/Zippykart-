<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 15px; }
        .logo-box { font-weight: 900; font-size: 20px; color: #333; display: flex; align-items: center; }
        .search-bar { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .nav-icons { display: flex; justify-content: center; gap: 20px; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; width: 60px; font-size: 11px; }
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
        .product-card { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-align: center; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: #fff; margin: 5% auto; padding: 20px; width: 400px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-cart-shopping" style="color:red; margin-right:8px;"></i> ZippyKart</div>
    <input type="text" class="search-bar" placeholder="Search...">
    <button style="background:#ff3e6c; color:white; border:none; padding:10px;">CART (0)</button>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt" style="color:#ff5722;"></i>Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress" style="color:#e91e63;"></i>Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja" style="color:#673ab7;"></i>Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-child-reaching" style="color:#2196f3;"></i>Kids</div>
    <div class="nav-cat"><i class="fa-solid fa-robot" style="color:#4caf50;"></i>Toys</div>
    <div class="nav-cat"><i class="fa-solid fa-clock" style="color:#ff9800;"></i>Watch</div>
    <div class="nav-cat"><i class="fa-solid fa-wand-magic-sparkles" style="color:#9c27b0;"></i>Cosmetic</div>
    <div class="nav-cat"><i class="fa-solid fa-headphones" style="color:#00bcd4;"></i>Electronics</div>
</div>

<div class="product-grid" id="productGrid"></div>

<!-- Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span onclick="closeModal()" style="float:right; cursor:pointer;">&times;</span>
        <img id="modalImg" src="" style="width:100%; height:200px;">
        <h2 id="modalName"></h2>
        <p id="modalDesc">Premium quality product designed for your comfort.</p>
        <button style="background:#ff3e6c; color:#fff; border:none; padding:10px; width:100%;">Buy Now</button>
    </div>
</div>

<script>
    const products = [
        { n: "Streetwear Tee", p: 899, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" },
        { n: "Cargo Pants", p: 1299, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=300" },
        { n: "Floral Gown", p: 1499, img: "https://images.unsplash.com/photo-1515372039744-b8f02a3ae2a6?w=300" },
        { n: "Headphones", p: 3499, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" }
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(item => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${item.img}" onclick="openModal('${item.n}', '${item.img}')">
                <div style="font-weight:bold; font-size:12px; margin:5px 0;">${item.n}</div>
                <div style="color:red; font-weight:bold;">₹${item.p}</div>
                <button class="add-btn" onclick="alert('Added to Cart')">Add to Cart</button>
            </div>`;
    });

    function openModal(name, img) {
        document.getElementById('modalName').innerText = name;
        document.getElementById('modalImg').src = img;
        document.getElementById('productModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('productModal').style.display = 'none'; }
    window.onclick = (e) => { if(e.target == document.getElementById('productModal')) closeModal(); };
</script>
</body>
</html>
