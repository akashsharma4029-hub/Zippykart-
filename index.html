<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippykart.co.in</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f1f2f4; margin: 0; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .card { background: #fff; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #ddd; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .buy-btn { width: 100%; padding: 10px; background: #111; color: #fff; border: none; margin-top: 10px; cursor: pointer; }
        #authOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 25px; border-radius: 10px; width: 280px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; font-size:20px;">Zippy<span style="color:red;">Kart</span></div>
    <div onclick="document.getElementById('authOverlay').style.display='flex'" style="cursor:pointer;"><i class="fa-solid fa-user"></i> Login</div>
</header>

<div id="authOverlay">
    <div class="auth-box">
        <h3>Login / Sign Up</h3>
        <input type="tel" id="phoneInput" placeholder="Mobile Number" style="width:90%; padding:10px; margin:10px 0;">
        <button id="otpBtn" style="width:100%; padding:10px; background:#000; color:#fff; border:none; cursor:pointer;">Send OTP</button>
        <button id="googleBtn" style="width:100%; padding:10px; background:#4285F4; color:#fff; border:none; margin-top:10px; cursor:pointer;">Sign in with Google</button>
        <button onclick="document.getElementById('authOverlay').style.display='none'" style="width:100%; padding:10px; background:#ccc; border:none; margin-top:10px; cursor:pointer;">Close</button>
    </div>
</div>

<div class="grid" id="productGrid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBr0cS6jfEOyyl8S2uvhaTgBVb6o8q_Xw4",
        authDomain: "zippykartproduction.firebaseapp.com",
        projectId: "zippykartproduction",
        storageBucket: "zippykartproduction.firebaseapp.com",
        messagingSenderId: "337115975126",
        appId: "1:337115975126:web:36bee625cda4094a69622d"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Google Login Logic
    document.getElementById('googleBtn').addEventListener('click', () => {
        signInWithPopup(auth, new GoogleAuthProvider())
            .then((result) => alert("Welcome, " + result.user.displayName))
            .catch((error) => alert("Error: " + error.message));
    });

    // Simple Alert for OTP (Placeholder until logic is fully bound)
    document.getElementById('otpBtn').onclick = () => alert("OTP System Active! Please check console for setup logs.");
</script>
</body>
</html>
