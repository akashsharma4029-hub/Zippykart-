<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f9fa; }
        header { background: #fff; padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; gap: 15px; }
        .logo-box { font-weight: 900; font-size: 20px; color: #333; display: flex; align-items: center; }
        .search-bar { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .nav-icons { display: flex; justify-content: center; gap: 20px; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .nav-cat { text-align: center; cursor: pointer; width: 60px; font-size: 11px; }
        .nav-cat i { display: block; font-size: 22px; margin-bottom: 5px; }
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
        .product-card { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 6px; text-align: center; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; }
        .add-btn { background: #000; color: #fff; border: none; padding: 8px; width: 100%; cursor: pointer; }
        .buy-btn { background: #ff3e6c; color: #fff; border: none; padding: 8px; width: 100%; margin-top: 5px; cursor: pointer; }
        .dropdown { display: none; position: absolute; top: 100%; right: 10%; background: #fff; border: 1px solid #ddd; width: 200px; z-index: 9999; }
        .dropdown div { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo-box"><i class="fa-solid fa-cart-shopping" style="color:red; margin-right:8px;"></i> ZippyKart</div>
    <input type="text" class="search-bar" placeholder="Search...">
    <div class="menu-wrapper" onclick="document.getElementById('loginDrop').style.display='block'">LOGIN ▾
        <div id="loginDrop" class="dropdown">
            <div onclick="showAuth()">My Profile</div>
            <div>Orders</div>
        </div>
    </div>
    <button style="background:#ff3e6c; color:white; border:none; padding:10px;">CART (0)</button>
</header>

<div class="nav-icons">
    <div class="nav-cat"><i class="fa-solid fa-shirt"></i>Men</div>
    <div class="nav-cat"><i class="fa-solid fa-person-dress"></i>Women</div>
    <div class="nav-cat"><i class="fa-solid fa-user-ninja"></i>Sweatshirt</div>
    <div class="nav-cat"><i class="fa-solid fa-robot"></i>Toys</div>
</div>

<div class="product-grid" id="productGrid"></div>

<div id="authOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#fff; padding:20px; width:250px; text-align:center;">
        <h3>Login / Signup</h3>
        <input type="email" id="email" placeholder="Email" style="width:90%; padding:8px;"><br><br>
        <input type="password" id="pass" placeholder="Password" style="width:90%; padding:8px;"><br><br>
        <button id="loginBtn" style="width:100%; padding:10px;">Login/Signup</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    
    // Firebase & Razorpay Config
    const firebaseConfig = { apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk", projectId: "zippykart-production-157e1" };
    const auth = getAuth(initializeApp(firebaseConfig));
    const rzpKey = "rzp_test_YourActualKeyHere"; 

    const store = [
        {n: "Streetwear Tee", p: 899, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300"},
        {n: "Cargo Pants", p: 1299, img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=300"}
    ];

    const grid = document.getElementById('productGrid');
    store.forEach(item => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${item.img}">
                <div class="p-name">${item.n}</div>
                <div style="color:red;">₹${item.p}</div>
                <button class="add-btn">Add to Cart</button>
                <button class="buy-btn" onclick="pay('${item.p}')">Buy Now</button>
            </div>`;
    });

    window.pay = (price) => {
        new Razorpay({ "key": rzpKey, "amount": price * 100, "currency": "INR", "name": "ZippyKart", "handler": function(r){ alert("Payment Success!"); } }).open();
    };
    window.showAuth = () => document.getElementById('authOverlay').style.display = 'flex';
    document.getElementById('loginBtn').onclick = () => {
        createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
        .then(() => alert("Logged In!")).catch(() => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value));
    };
</script>
</body>
</html>
