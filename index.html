<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippykart.co.in | Store</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f1f2f4; margin: 0; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; background: #fff; min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 1; padding: 10px; }
        .dropdown-content a { display: block; padding: 8px; text-decoration: none; color: #333; }
        .dropdown-content a i { margin-right: 10px; width: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #fff; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #ddd; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .buy-btn { width: 100%; padding: 10px; background: #111; color: #fff; border: none; margin-top: 10px; cursor: pointer; }
        #adminPanel { display: none; padding: 40px; background: #fff; min-height: 100vh; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; font-size:20px;">Zippy<span style="color:red;">Kart</span></div>
    <div>
        <div class="menu-dropdown">
            <span style="cursor:pointer;"><i class="fa-solid fa-user"></i> Login <i class="fa-solid fa-chevron-down"></i></span>
            <div class="dropdown-content">
                <a href="#"><i class="fa-solid fa-user-circle"></i> My Profile</a>
                <a href="#"><i class="fa-solid fa-shield-halved"></i> Zippykart Plus Zone</a>
                <a href="#"><i class="fa-solid fa-box"></i> Orders</a>
                <a href="#"><i class="fa-solid fa-heart"></i> Wishlist</a>
            </div>
        </div>
        <div class="menu-dropdown" style="margin-left:15px;">
            <span style="cursor:pointer;">More <i class="fa-solid fa-chevron-down"></i></span>
            <div class="dropdown-content">
                <a href="#"><i class="fa-solid fa-store"></i> Become a Seller</a>
                <a href="#"><i class="fa-solid fa-bell"></i> Notification Settings</a>
                <a href="#"><i class="fa-solid fa-headset"></i> 24x7 Customer Care</a>
                <a href="#"><i class="fa-solid fa-bullhorn"></i> Advertise on Zippykart</a>
            </div>
        </div>
        <button style="margin-left:15px; padding:8px 12px;">Cart (<span id="cartCount">0</span>)</button>
    </div>
</header>

<div id="storeView">
    <h2 style="padding:20px; text-align:center;">Trending Culture Drops</h2>
    <div class="grid" id="productGrid"></div>
</div>

<!-- Admin Panel -->
<div id="adminPanel">
    <h1>Admin Terminal</h1>
    <input type="text" id="admId" placeholder="ID"><br>
    <input type="text" id="admTitle" placeholder="Title"><br>
    <input type="number" id="admPrice" placeholder="Price"><br>
    <input type="text" id="admImg" placeholder="Image URL"><br>
    <button onclick="saveProduct()">Upload to Cloud</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const db = getDatabase(initializeApp({ apiKey: "AIzaSyAAZ2tUtGTxSVCM8YkYCu4n4e5-vHq-mMo", databaseURL: "https://zippykart-production-default-rtdb.firebaseio.com", projectId: "zippykart-production" }));

    // Toggle Dropdowns
    document.querySelectorAll('.menu-dropdown').forEach(item => {
        item.onmouseenter = () => item.querySelector('.dropdown-content').style.display = 'block';
        item.onmouseleave = () => item.querySelector('.dropdown-content').style.display = 'none';
    });

    window.onload = () => {
        if(window.location.search.includes("admin=true")) {
            document.getElementById('adminPanel').style.display = "block";
            document.getElementById('storeView').style.display = "none";
        }
        fetchData();
    };

    function fetchData() {
        onValue(ref(db, 'products'), (snapshot) => {
            const data = snapshot.val();
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            for(let id in data) {
                let p = data[id];
                grid.innerHTML += `<div class="card">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
                    <p><b>${p.title}</b></p>
                    <p>₹${p.price}</p>
                    <button class="buy-btn" onclick="triggerRazorpay(${p.price})">ADD TO CART</button>
                </div>`;
            }
        });
    }

    window.saveProduct = () => {
        const id = document.getElementById('admId').value;
        set(ref(db, 'products/' + id), { title: document.getElementById('admTitle').value, price: document.getElementById('admPrice').value, img: document.getElementById('admImg').value });
        alert("Product Uploaded Successfully!");
    };

    window.triggerRazorpay = (price) => {
        var options = { "key": "rzp_live_SuidRs4KmU9W6w", "amount": price * 100, "currency": "INR", "name": "Zippykart", "description": "Checkout", "handler": function(res){ alert("Payment Success!"); } };
        new Razorpay(options).open();
    };
</script>
</body>
</html>
