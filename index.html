<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zippykart.co.in | Store</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f1f2f4; margin: 0; }
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .card { background: #fff; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #ddd; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .buy-btn { width: 100%; padding: 10px; background: #111; color: #fff; border: none; margin-top: 10px; text-transform: uppercase; font-weight: bold; cursor: pointer; }
        #authOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 25px; border-radius: 10px; width: 280px; text-align: center; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; font-size:20px;">Zippy<span style="color:red;">Kart</span></div>
    <div style="display:flex; align-items:center; gap:10px;">
        <span onclick="document.getElementById('authOverlay').style.display='flex'" style="cursor:pointer;"><i class="fa-solid fa-user"></i> Login</span>
        <button>Cart (0)</button>
    </div>
</header>

<div id="authOverlay">
    <div class="auth-box">
        <h3>Login / Sign Up</h3>
        <input type="tel" id="phoneInput" placeholder="Mobile Number (+91...)" style="width:90%; padding:10px; margin:10px 0;">
        <button id="sendOtpBtn" style="width:100%; padding:10px; background:#f0f0f0; border:1px solid #ccc; cursor:pointer;">Send OTP</button>
        <button id="googleBtn" style="width:100%; padding:10px; background:#4285F4; color:#fff; border:none; margin-top:10px; cursor:pointer;">Sign in with Google</button>
        <button onclick="document.getElementById('authOverlay').style.display='none'" style="width:100%; padding:10px; background:#ccc; border:none; margin-top:10px; cursor:pointer;">Close</button>
    </div>
</div>

<h2 style="text-align:center; padding:20px;">Trending Culture Drops</h2>
<div class="grid" id="productGrid"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBr0cS6jfEOyyl8S2uvhaTgBVb6o8q_Xw4",
        authDomain: "zippykartproduction.firebaseapp.com",
        projectId: "zippykartproduction",
        storageBucket: "zippykartproduction.firebaseapp.com",
        messagingSenderId: "337115975126",
        appId: "1:337115975126:web:36bee625cda4094a69622d"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    document.getElementById('googleBtn').onclick = () => {
        signInWithPopup(auth, new GoogleAuthProvider())
            .then(() => alert("Login Successful!"))
            .catch((err) => alert(err.message));
    };

    onValue(ref(db, 'products'), (snapshot) => {
        const data = snapshot.val();
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        for(let id in data) {
            let p = data[id];
            grid.innerHTML += `<div class="card">
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
                <p><b>${p.title}</b></p>
                <p>₹${p.price}</p>
                <button class="buy-btn" onclick="triggerRazorpay(${p.price})">ADD TO CART</button>
            </div>`;
        }
    });

    window.triggerRazorpay = (price) => {
        new Razorpay({ "key": "rzp_live_SuidRs4KmU9W6w", "amount": price * 100, "currency": "INR", "name": "Zippykart", "handler": function(res){ alert("Payment Success!"); } }).open();
    };
</script>
</body>
</html>
