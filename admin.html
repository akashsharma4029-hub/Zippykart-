<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZippyKart Pro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { display:flex; height:100vh; background:#f4f7fb; }
        .sidebar { width:250px; background:#1e293b; color:white; }
        .menu-item { padding:20px; cursor:pointer; display:flex; align-items:center; gap:15px; border-bottom:1px solid #334155; }
        .menu-item.active { background:#e02844; }
        .main { flex:1; padding:30px; overflow-y:auto; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .card { background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { padding:15px; border-bottom:1px solid #ddd; text-align:left; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding:20px; font-weight:bold; font-size:20px; color:#e02844;">ZippyKart Admin</div>
        <div class="menu-item active" onclick="showTab('Dashboard', this)"><i class="fas fa-home"></i> Dashboard</div>
        <div class="menu-item" onclick="showTab('Products', this)"><i class="fas fa-box"></i> Products</div>
    </div>

    <div class="main">
        <div id="Dashboard" class="tab-content active">
            <div class="card">
                <h1>Live Orders</h1>
                <table>
                    <thead><tr><th>Product</th><th>Customer</th><th>Status</th></tr></thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>
        </div>

        <div id="Products" class="tab-content">
            <div class="card">
                <button onclick="alert('Open Add Product Form')" style="padding:10px; background:#e02844; color:white; border:none; border-radius:5px;">Add New Product</button>
                <table>
                    <thead><tr><th>Image</th><th>Title</th><th>Price</th></tr></thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { /* Apna Config wahi rakhein */ };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function showTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            el.classList.add('active');
            if(tabName === 'Products') loadProducts();
        }

        db.collection("zippykart_orders").onSnapshot(snap => {
            let html = "";
            snap.forEach(doc => { 
                let o = doc.data(); 
                html += `<tr><td>${o.productTitle}</td><td>${o.customerInfo?.name}</td><td>${o.status}</td></tr>`;
            });
            document.getElementById('ordersBody').innerHTML = html;
        });

        function loadProducts() {
            db.collection("zippykart_products").onSnapshot(snap => {
                let html = "";
                snap.forEach(doc => {
                    let p = doc.data();
                    html += `<tr><td><img src="${p.image}" width="50"></td><td>${p.title}</td><td>₹${p.price}</td></tr>`;
                });
                document.getElementById('productsBody').innerHTML = html;
            });
        }
    </script>
</body>
</html>
