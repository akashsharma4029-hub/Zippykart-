<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZippyKart Ultra-Pro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background: #0f172a; color: white; display:flex; height:100vh; overflow:hidden; }
        
        /* Sidebar - Glassmorphism */
        .sidebar { width:280px; background:rgba(255,255,255,0.05); backdrop-filter:blur(15px); border-right:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; }
        .menu-item { padding:20px 30px; cursor:pointer; display:flex; align-items:center; gap:15px; color:#94a3b8; transition:0.4s; border-left:4px solid transparent; }
        .menu-item:hover, .menu-item.active { background:rgba(224,40,68,0.15); color:#e02844; border-left-color:#e02844; }
        
        /* Main Container */
        .main { flex:1; padding:40px; overflow-y:auto; }
        .page { display:none; animation: slideIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .page.active { display:block; }
        @keyframes slideIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
        
        /* Premium Dashboard Card */
        .glass-card { background:rgba(255,255,255,0.03); backdrop-filter:blur(10px); padding:30px; border-radius:20px; border:1px solid rgba(255,255,255,0.1); margin-bottom:20px; }
        button.pro-btn { background:linear-gradient(45deg, #e02844, #fb641b); color:white; border:none; padding:12px 25px; border-radius:10px; cursor:pointer; font-weight:600; transition:0.3s; }
        button.pro-btn:hover { transform:scale(1.05); box-shadow:0 0 20px rgba(224,40,68,0.5); }
    </style>
</head>
<body>

<div class="sidebar">
    <div style="padding:30px; font-weight:800; font-size:24px; color:#e02844; letter-spacing:2px;">ZIPPY<span style="color:white;">KART</span></div>
    <div class="menu-item active" onclick="nav('Dash', this)"><i class="fas fa-microchip"></i> Dashboard</div>
    <div class="menu-item" onclick="nav('Prods', this)"><i class="fas fa-tags"></i> Inventory</div>
    <div class="menu-item" onclick="nav('Cust', this)"><i class="fas fa-user-shield"></i> Customers</div>
</div>

<div class="main">
    <div id="Dash" class="page active">
        <h1 style="margin-bottom:30px;">Ultra-Pro Command Center</h1>
        <div class="glass-card">
            <h2>Live Sales Feed</h2>
            <div id="orderList"></div>
        </div>
    </div>
    
    <div id="Prods" class="page">
        <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1>Inventory Master</h1>
                <button class="pro-btn" onclick="document.getElementById('modal').style.display='flex'">+ Add New Product</button>
            </div>
            <div id="productList"></div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
    <div class="glass-card" style="width:500px;">
        <h2 style="margin-bottom:20px;">New Product Entry</h2>
        <input id="title" placeholder="Product Title" style="width:100%; padding:15px; margin-bottom:10px; border-radius:8px;">
        <input id="price" placeholder="Selling Price" style="width:100%; padding:15px; margin-bottom:20px; border-radius:8px;">
        <button class="pro-btn" style="width:100%;" onclick="save()">Publish to Store</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="width:100%; margin-top:10px; background:transparent; border:none; color:white;">Cancel</button>
    </div>
</div>

<script>
    const db = firebase.firestore();
    function nav(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }
    
    function save() {
        db.collection("zippykart_products").add({
            title: document.getElementById('title').value,
            price: document.getElementById('price').value
        }).then(() => alert("Product Added! Data is Live."));
    }
</script>
</body>
</html>
