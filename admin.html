<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZippyKart Pro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background-color: #f4f7f6; color: #333; overflow-x: hidden; }

        .sidebar { width: 250px; background-color: #1a1a2e; color: white; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; transition: 0.3s; }
        .sidebar h2 { text-align: center; color: #ff4b4b; padding: 20px 0; font-size: 24px; border-bottom: 1px solid #2a2a4a; margin-bottom: 10px; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 15px 20px; border-bottom: 1px solid #2a2a4a; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .sidebar ul li:hover, .sidebar ul li.active { background-color: #ff4b4b; color: white; }
        
        .main-content { margin-left: 250px; width: calc(100% - 250px); min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; padding: 20px; }
        .page-title { font-size: 22px; margin-bottom: 20px; color: #1a1a2e; }

        .form-container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); max-width: 800px; margin: 0 auto; }
        .form-section { margin-bottom: 25px; border: 1px solid #eee; padding: 15px; border-radius: 8px; }
        .form-section h3 { color: #ff4b4b; font-size: 16px; margin-bottom: 15px; display: flex; gap: 8px; align-items: center; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        label { font-size: 13px; color: #666; font-weight: 600; margin-bottom: 5px; display: block; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; transition: 0.3s; font-size: 14px; }
        input:focus, textarea:focus { border-color: #ff4b4b; }

        .action-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn-save { background: #ff4b4b; color: white; display: flex; gap: 8px; align-items: center; transition: 0.3s; }
        .btn-save:disabled { opacity: 0.7; cursor: not-allowed; }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; width: 100%; }
            .input-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🛒 ZippyKart</h2>
        <ul>
            <li><i class="fas fa-chart-pie"></i> Dashboard</li>
            <li class="active"><i class="fas fa-plus-square"></i> Add Product</li>
            <li><i class="fas fa-box-open"></i> Inventory</li>
        </ul>
    </div>

    <div class="main-content">
        <h2 class="page-title">Add New Product to Live Website</h2>
        
        <div class="form-container">
            <form id="productForm" onsubmit="saveProduct(event)">
                
                <div class="form-section">
                    <h3><i class="fas fa-info-circle"></i> Basic Information</h3>
                    <div class="input-grid">
                        <div class="full-width">
                            <label>Product Title Name</label>
                            <input type="text" id="pTitle" placeholder="e.g. Oversized Maroon T-shirt" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-rupee-sign"></i> Pricing</h3>
                    <div class="input-grid">
                        <div>
                            <label>Selling Price (₹)</label>
                            <input type="number" id="pPrice" placeholder="599" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fas fa-image"></i> Product Image (Direct URL)</h3>
                    <div class="input-grid">
                        <div class="full-width">
                            <label>Cover Image Link</label>
                            <input type="url" id="pCover" placeholder="https://..." required>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn btn-save" id="saveBtn">
                        <i class="fas fa-upload" id="saveIcon"></i> <span id="saveText">Upload to ZippyKart</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. Aapki Asli Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCTPYITHNUzAWLdMXx9zraOJxyEp4mnXpk",
            authDomain: "zippykart-production-157e1.firebaseapp.com",
            projectId: "zippykart-production-157e1",
            storageBucket: "zippykart-production-157e1.appspot.com",
            messagingSenderId: "803651431969",
            appId: "1:803651431969:web:7432f351ec9f5f0ec23d60",
            measurementId: "G-7ZJQQTZE1C"
        };
        
        // 2. Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 3. Save Function
        function saveProduct(event) {
            event.preventDefault(); // Page reload hone se rokenge
            
            let btn = document.getElementById("saveBtn");
            let text = document.getElementById("saveText");
            let icon = document.getElementById("saveIcon");
            
            // Button ko loading state mein daalna
            btn.disabled = true;
            text.innerHTML = "Publishing...";
            icon.className = "fas fa-spinner fa-spin";
            btn.style.backgroundColor = "#555";
            
            // Form se data uthana
            const title = document.getElementById("pTitle").value;
            const price = document.getElementById("pPrice").value;
            const image = document.getElementById("pCover").value;
            
            // Firebase Database mein Bhejna
            db.collection("zippykart_products").add({
                title: title,
                price: price,
                image: image,
                timestamp: firebase.firestore.FieldValue.serverTimestamp() // Upload ka time record karega
            })
            .then(() => {
                // Success message
                text.innerHTML = "Live on Website!";
                icon.className = "fas fa-check-circle";
                btn.style.backgroundColor = "#28a745"; // Green color
                
                // 3 second baad form reset karna
                setTimeout(() => {
                    text.innerHTML = "Upload to ZippyKart";
                    icon.className = "fas fa-upload";
                    btn.style.backgroundColor = "#ff4b4b";
                    btn.disabled = false;
                    document.getElementById("productForm").reset();
                }, 3000);
            })
            .catch((error) => {
                alert("Error: " + error.message);
                text.innerHTML = "Upload to ZippyKart";
                icon.className = "fas fa-upload";
                btn.style.backgroundColor = "#ff4b4b";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
